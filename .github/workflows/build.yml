name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: |
          Z=$(ls *.zip | sort -V | tail -1)
          echo "Using $Z"
          mkdir -p work
          unzip -q -o "$Z" -d work
          S=$(find work -name settings.gradle | head -1)
          echo "PROJECT=$(dirname "$S")" >> $GITHUB_ENV
      - name: Build debug APK
        run: cd "$PROJECT" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: KimikbKeyboard-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/*.apk
